# Same-origin reverse proxy. Add a `listen 443 ssl` server with real certificates (or terminate TLS at a load balancer) before production.
upstream api { server api:4000; }
upstream web { server web:3000; }
server {
  listen 80;
  client_max_body_size 30m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 75s; }
  location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
