# Local/staging stack. Production: supply real secrets via your secret manager, terminate TLS in nginx, and review docs/DEPLOYMENT.md.
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: kodems, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: kodems }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kodems"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ "redisdata:/data" ]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [ .env ]
    environment:
      DATABASE_URL: "postgresql://kodems:${POSTGRES_PASSWORD}@db:5432/kodems"
      REDIS_URL: redis://redis:6379
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    volumes: [ "uploads:/app/uploads" ]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}/api/v1", NEXT_PUBLIC_SOCKET_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}", NEXT_PUBLIC_MAP_TILES: "${MAP_TILES}", NEXT_PUBLIC_MAP_ATTRIBUTION: "${MAP_ATTRIBUTION}" } }
    depends_on: [ api ]
  nginx:
    image: nginx:1.27-alpine
    volumes: [ "./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    ports: [ "8080:80" ]
    depends_on: [ api, web ]
volumes: { pgdata: {}, redisdata: {}, uploads: {} }
